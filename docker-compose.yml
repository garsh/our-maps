services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    ports:
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - our-maps

  our-maps:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    container_name: our-maps
    env_file:
      - .env
    # Expose port 3000 publicly so the Android app can connect via plain HTTP without TLS errors
    ports:
      - "3001:3001"
    volumes:
      - our_maps_data:/data
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3001}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://ourmaps.mooo.com}
      - DB_PATH=${DB_PATH:-/data/database.sqlite}

volumes:
  our_maps_data:
  caddy_data:
  caddy_config:
