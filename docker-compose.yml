services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    ports:
      - "443:443"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - our-maps

  our-maps:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    container_name: our-maps
    env_file:
      - .env
    # Do not publish PORT on the host. Caddy is the only public entry (443).
    # The app still listens on PORT for reverse_proxy on the Docker network.
    volumes:
      - our_maps_data:/data
      - ./data/maps:/app/data/maps
      - ./data/sprites:/app/data/sprites
      - ./data/maps:/app/server/public/maps
      - ./data/sprites:/app/server/public/sprites
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3001}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://ourmaps.mooo.com}
      - DB_PATH=${DB_PATH:-/data/database.sqlite}

volumes:
  our_maps_data:
  caddy_data:
  caddy_config:
